spring:
  application:
    name: listek-admin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/listek}
    username: ${DB_USERNAME:listek}
    password: ${DB_PASSWORD:listek}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/admin
    table: flyway_schema_history_admin
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8090}

app:
  loan:
    repayment-account-number: ${APP_LOAN_REPAYMENT_ACCOUNT_NUMBER:LOAN-REPAYMENT}
    variable-symbol: ${APP_LOAN_VARIABLE_SYMBOL:0}
    specific-symbol: ${APP_LOAN_SPECIFIC_SYMBOL:0}
    repayment-day-of-month: ${APP_LOAN_REPAYMENT_DAY_OF_MONTH:15}
