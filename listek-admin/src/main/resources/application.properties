spring.application.name=listek-admin

spring.config.import=vault://

spring.cloud.vault.uri=${SPRING_CLOUD_VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${SPRING_CLOUD_VAULT_TOKEN:dev-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=listek-admin

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/admin
spring.flyway.table=flyway_schema_history_admin
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8090}

app.loan.repayment-day-of-month=${APP_LOAN_REPAYMENT_DAY_OF_MONTH:15}