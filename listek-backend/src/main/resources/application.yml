spring:
  application:
    name: listek-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/listek}
    username: ${DB_USERNAME:listek}
    password: ${DB_PASSWORD:listek}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: false
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
