spring.application.name=listek-backend

spring.config.import=vault://

spring.cloud.vault.uri=${SPRING_CLOUD_VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${SPRING_CLOUD_VAULT_TOKEN:dev-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=listek

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info