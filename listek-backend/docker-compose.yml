services:
  vault:
    image: docker.io/hashicorp/vault:2.0.4
    command: ["server", "-dev", "-dev-root-token-id=local-dev-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-info}
    ports:
      - 8200:8200
      - 8201:8201
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17.7
    container_name: listek-postgres
    entrypoint: ["/bin/sh", "-ec"]
    command: ["if [ ! -s /auth/pg_hba.conf ]; then cp /config/pg_hba.trust.conf /auth/pg_hba.conf; fi\nexec docker-entrypoint.sh postgres -c hba_file=/auth/pg_hba.conf"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    depends_on:
      vault:
        condition: service_healthy
        restart: true
    ports:
      - "5433:5432"
    volumes:
      - listek-postgres-data:/var/lib/postgresql/data
      - postgres-auth:/auth
      - postgres-socket:/var/run/postgresql
      - ./postgres/pg_hba.trust.conf:/config/pg_hba.trust.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "exec gosu \"$$(stat -c %u /proc/1)\" pg_isready -q -h /var/run/postgresql"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-seed:
    build:
      context: .
      dockerfile: vault-seed.Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command: ["if vault kv get secret/listek >/dev/null 2>&1; then exit 0; fi\nDB_NAME=\"app_$(vault write -field=random_bytes sys/tools/random/8 format=hex)\"\nDB_USERNAME=\"app_$(vault write -field=random_bytes sys/tools/random/8 format=hex)\"\nDB_PASSWORD=\"$(vault write -field=random_bytes sys/tools/random/32 format=hex)\"\npsql -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres -v db_username=\"$${DB_USERNAME}\" -v db_password=\"$${DB_PASSWORD}\" <<'SQL'\nCREATE ROLE :\"db_username\" LOGIN PASSWORD :'db_password';\nSQL\ncreatedb -h /var/run/postgresql -U postgres -O \"$${DB_USERNAME}\" \"$${DB_NAME}\"\nDB_URL=\"jdbc:postgresql://postgres:5432/$${DB_NAME}\"\nvault kv put secret/listek DB_URL=\"$${DB_URL}\" DB_USERNAME=\"$${DB_USERNAME}\" DB_PASSWORD=\"$${DB_PASSWORD}\"\nvault kv put secret/listek-admin DB_URL=\"$${DB_URL}\" DB_USERNAME=\"$${DB_USERNAME}\" DB_PASSWORD=\"$${DB_PASSWORD}\"\ncp /config/pg_hba.scram.conf /auth/pg_hba.conf\npsql -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres -c \"SELECT pg_reload_conf()\"\nPGPASSWORD=\"$${DB_PASSWORD}\" psql -v ON_ERROR_STOP=1 -h postgres -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\" -c \"SELECT 1\""]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: local-dev-token
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - postgres-auth:/auth
      - postgres-socket:/var/run/postgresql
      - ./postgres/pg_hba.scram.conf:/config/pg_hba.scram.conf:ro

  listek-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listek-backend
    environment:
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: local-dev-token
      VAULT_ADDR: http://vault:8200
      SERVER_PORT: 8080
    depends_on:
      vault:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8080:8080"

  listek-frontend:
    build:
      context: ../listek-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://listek-backend:8080
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-frontend
    environment:
      BACKEND_URL: http://listek-backend:8080
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-backend:
        condition: service_healthy
        restart: true
    ports:
      - "3000:3000"

  listek-admin:
    build:
      context: ../listek-admin
      dockerfile: Dockerfile
    container_name: listek-admin
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: local-dev-token
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: local-dev-token
      SERVER_PORT: 8090
    depends_on:
      vault:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      listek-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8090/api/admin/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8090:8090"

  listek-manager:
    build:
      context: ../listek-manager
      dockerfile: Dockerfile
      args:
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-manager
    environment:
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-admin:
        condition: service_healthy
        restart: true
    ports:
      - "3001:3000"

volumes:
  listek-postgres-data:
  postgres-auth:
  postgres-socket:

