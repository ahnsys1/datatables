networks:
  listek-network:
    driver: bridge

services:
  postgres:
    image: postgres:17.7
    container_name: listek-postgres
    entrypoint: ["/bin/sh", "-ec"]
    command: ["if [ ! -s /auth/pg_hba.conf ]; then cp /config/pg_hba.trust.conf /auth/pg_hba.conf; fi\nexec docker-entrypoint.sh postgres -c hba_file=/auth/pg_hba.conf"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - listek-network
    ports:
      - "5433:5432"
    volumes:
      - listek-postgres-data:/var/lib/postgresql/data
      - postgres-auth:/auth
      - postgres-socket:/var/run/postgresql
      - ./postgres/pg_hba.trust.conf:/config/pg_hba.trust.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "exec gosu \"$$(stat -c %u /proc/1)\" pg_isready -q -h /var/run/postgresql"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-seed:
    build:
      context: .
      dockerfile: vault-seed.Dockerfile
    entrypoint: ["/bin/sh", "/scripts/vault-seed.sh"]
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_TOKEN: ${LISTEK_VAULT_TOKEN:?Use docker-compose-vault.sh to start the stack}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-auth:/auth
      - postgres-socket:/var/run/postgresql
      - ./postgres/pg_hba.scram.conf:/config/pg_hba.scram.conf:ro
      - ./vault-seed.sh:/scripts/vault-seed.sh:ro
    networks:
      - listek-network

  listek-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listek-backend
    networks:
      - listek-network
    environment:
      SPRING_CLOUD_VAULT_URI: http://host.docker.internal:8200
      SPRING_CLOUD_VAULT_TOKEN: ${LISTEK_VAULT_TOKEN:?Use docker-compose-vault.sh to start the stack}
      SERVER_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vault-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8080:8080"

  listek-frontend:
    build:
      context: ../listek-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://listek-backend:8080
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-frontend
    environment:
      BACKEND_URL: http://listek-backend:8080
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-backend:
        condition: service_healthy
        restart: true
    ports:
      - "3000:3000"
    networks:
      - listek-network


  listek-admin:
    build:
      context: ../listek-admin
      dockerfile: Dockerfile
    container_name: listek-admin
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_TOKEN: ${LISTEK_VAULT_TOKEN:?Use docker-compose-vault.sh to start the stack}
      SPRING_CLOUD_VAULT_URI: http://host.docker.internal:8200
      SPRING_CLOUD_VAULT_TOKEN: ${LISTEK_VAULT_TOKEN:?Use docker-compose-vault.sh to start the stack}
      SERVER_PORT: 8090
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      vault-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      listek-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8090/api/admin/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8090:8090"
    networks:
      - listek-network

  listek-manager:
    build:
      context: ../listek-manager
      dockerfile: Dockerfile
      args:
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-manager
    environment:
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-admin:
        condition: service_healthy
        restart: true
    ports:
      - "3001:3000"
    networks:
      - listek-network




volumes:
  listek-postgres-data:
  postgres-auth:
  postgres-socket:

