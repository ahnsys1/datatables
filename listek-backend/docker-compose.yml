services:
  vault:
    image: docker.io/hashicorp/vault:2.0.4
    command: server
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault:8200
      VAULT_CLUSTER_ADDR: https://vault:8201
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-info}
    ports:
      - 8200:8200
      - 8201:8201
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - listek-vault-data:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: listek-postgres
    environment:
      POSTGRES_DB: listek
      POSTGRES_USER: listek
      POSTGRES_PASSWORD: listek
    ports:
      - "5433:5432"
    volumes:
      - listek-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listek -d listek"]
      interval: 5s
      timeout: 5s
      retries: 10

  listek-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listek-backend
    environment:
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN must be set in .env}
      VAULT_ADDR: http://vault:8200
      SERVER_PORT: 8080
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8080:8080"

  listek-frontend:
    build:
      context: ../listek-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://listek-backend:8080
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-frontend
    environment:
      BACKEND_URL: http://listek-backend:8080
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-backend:
        condition: service_healthy
        restart: true
    ports:
      - "3000:3000"

  listek-admin:
    build:
      context: ../listek-admin
      dockerfile: Dockerfile
    container_name: listek-admin
    environment:
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN must be set in .env}
      VAULT_ADDR: http://vault:8200
      SERVER_PORT: 8090
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      listek-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8090/api/admin/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8090:8090"

  listek-manager:
    build:
      context: ../listek-manager
      dockerfile: Dockerfile
      args:
        ADMIN_BACKEND_URL: http://listek-admin:8090
    container_name: listek-manager
    environment:
      ADMIN_BACKEND_URL: http://listek-admin:8090
    depends_on:
      listek-admin:
        condition: service_healthy
        restart: true
    ports:
      - "3001:3000"

volumes:
  listek-postgres-data:
  listek-vault-data:
